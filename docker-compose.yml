version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myblog_app
    restart: unless-stopped
    working_dir: /var/www/app
    volumes:
      - ./:/var/www
    networks:
      - myblog
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: myblog_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myblog
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_PASSWORD: dbpass
      MYSQL_USER: dbuser
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - myblog

  nginx:
    image: nginx:alpine
    container_name: myblog_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - myblog

networks:
  myblog:
    driver: bridge